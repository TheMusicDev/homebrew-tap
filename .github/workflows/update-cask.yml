# Keeps Casks/chopastem.rb in step with chopastem.com's update feed, every 6 hours. See the README ("How it stays up to date").
name: update-cask
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {} # run it now: Actions tab > update-cask > Run workflow, or `gh workflow run update-cask.yml`
permissions:
  contents: write # push the cask (and the keepalive commit) to main
concurrency:
  group: update-cask
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-latest # macOS because the script also checks the app is notarized (spctl, stapler)
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Test the update script (fake feeds)
        run: script/check-update-cask.sh
      - name: Update the cask if the feed announces a newer, verified version
        run: script/update-cask.sh
      - name: Commit and push if the cask changed
        run: |
          if git diff --quiet -- Casks; then
            echo "cask unchanged"
          else
            version=$(sed -nE 's/^ *version "([^"]+)".*/\1/p' Casks/chopastem.rb | head -1)
            git add Casks/chopastem.rb
            git commit -m "chopastem $version"
            git push
          fi
      - name: Keep the schedule alive
        run: |
          # GitHub pauses scheduled workflows after 60 days with no activity in the repo. A quiet stretch between
          # releases would silently stop the updates, so after 45 quiet days leave one empty commit.
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last > 45 * 86400 )); then
            git commit --allow-empty -m "chore: keepalive (GitHub pauses scheduled workflows after 60 days without activity)"
            git push
          fi
